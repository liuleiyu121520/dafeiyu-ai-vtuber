# 大肥鱼 AI 虚拟主播 · macOS 单机 Docker 编排
#
# 只有一个服务。原项目的 WebUI「一键运行」会自己 Popen main.py，
# Compose 再起一个 worker 就会出现两套播放队列/弹幕监听/TTS。
# 容器内进程树：
#   tini(1) ─ entrypoint.sh ─┬ caption_printer.py   :5500  (字幕 + 舞台信号 + 音频桥)
#                            ├ integrations/.../hub  :8888  (弹幕 Hub，可选)
#                            └ webui.py             :8081  → main.py :8082/:12345
name: dafeiyu

services:
  dafeiyu:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: dafeiyu-ai-vtuber:macos-arm64
    platform: linux/arm64
    container_name: dafeiyu
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      # ---- 容器内路径 ----
      APP_DIR: /app
      TZ: Asia/Shanghai
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      # 容器里没有声卡，SDL 用 dummy 驱动，只保证 pygame 能初始化不炸
      SDL_AUDIODRIVER: dummy

      # ---- 监听地址（关键）----
      # 容器内必须绑 0.0.0.0。绑 127.0.0.1 时 Docker Desktop 的端口转发
      # 「TCP 连得上但一个字节都不回」，宿主机和 OBS 全部拿不到数据。
      # 对外暴露仍由下面的 ports 限制在 127.0.0.1，安全性不受影响。
      WEBUI_HOST: 0.0.0.0
      CAPTION_BIND: 0.0.0.0
      BARRAGE_HUB_BIND: 0.0.0.0

      # ---- 端口 ----
      WEBUI_PORT: "${WEBUI_PORT:-8081}"
      API_PORT: "${API_PORT:-8082}"
      LIVE2D_PORT: "${LIVE2D_PORT:-12345}"
      CAPTION_PORT: "${CAPTION_PORT:-5500}"
      BARRAGE_HUB_PORT: "${BARRAGE_HUB_PORT:-8888}"

      # ---- 行为开关 ----
      BARRAGE_MODE: "${BARRAGE_MODE:-mock}"
      ENABLE_CAPTION_SERVICE: "${ENABLE_CAPTION_SERVICE:-1}"
      APPLY_ENV_CONFIG: "${APPLY_ENV_CONFIG:-1}"
      AUTO_RUN: "${AUTO_RUN:-1}"

    ports:
      # 默认只绑 127.0.0.1：管理接口不外网暴露
      - "127.0.0.1:${WEBUI_PORT:-8081}:8081"
      - "127.0.0.1:${API_PORT:-8082}:8082"
      - "127.0.0.1:${LIVE2D_PORT:-12345}:12345"
      - "127.0.0.1:${CAPTION_PORT:-5500}:5500"
      # 8888 是唯一对外放开的端口：弹幕 Hub 要接局域网内另一台机器送来的
      # 弹幕（Windows 上跑 WssBarrageServer.exe）。只给局域网用，别映射到公网。
      # 不想对外时把 BARRAGE_HUB_BIND_ADDR 设成 127.0.0.1 即可收回。
      - "${BARRAGE_HUB_BIND_ADDR:-0.0.0.0}:${BARRAGE_HUB_PORT:-8888}:8888"

    volumes:
      # 配置：整份挂进去，WebUI 保存后宿主机立刻能看到
      - ./config.json:/app/config.json
      # 代码与静态资源挂载：修改实时生效
      - ./webui.py:/app/webui.py
      - ./webui_app:/app/webui_app
      - ./utils:/app/utils
      # docker/ 必须挂：apply_env_config.py 负责把 .env 的 MLX_TTS_VOICE 等写进
      # config.json。镜像内是旧版、没有 MLX_TTS_* 映射表，导致 .env 改了音色
      # 也没人认（报「无变化」），只能等 rebuild 镜像才生效。
      # entrypoint.sh / healthcheck.py 两边内容一致，且实际执行的是
      # /usr/local/bin 下的副本，挂载不影响启动。
      - ./docker:/app/docker
      - ./ui:/app/ui
      - ./tests:/app/tests
      # 持久化：容器重建不丢
      - ./log:/app/log
      - ./out:/app/out
      - ./data:/app/data
      - ./song:/app/song
      - ./bgm_cache:/app/bgm_cache
      # Live2D 整目录挂载：html/js/css/assets 改动实时生效，不用再 docker cp。
      # 背景视频等素材放进 Live2D/assets/ 后容器立刻能播。
      - ./Live2D:/app/Live2D
      # Live2D 模型（大肥鱼模型不在仓库里，宿主机准备好后挂进来）
      - ./Live2D/live2d-model:/app/Live2D/live2d-model
      # 说明：以前只挂模型目录、其余走镜像内副本，改一次舞台页就得 rebuild 或
      # docker cp（cp 写的是容器可写层，down 掉就没了）。宿主机 Live2D 与镜像
      # 内容已逐文件核对一致，整目录挂载不会让舞台页 404。
      # integrations/ 挂载：抖音采集器 collector.py 住在这里，改了即生效，
      # 不用 rebuild 镜像（镜像内那份没有 collector）。
      - ./integrations:/app/integrations

    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py", "--quiet"]
      interval: 20s
      timeout: 8s
      start_period: 90s
      retries: 5

    # 优雅停止：先 TERM 让 entrypoint 收子进程，再 KILL
    stop_grace_period: 20s
    stop_signal: SIGTERM

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # 音频缓存清理：out/ 里每天积累的临时 wav 由 scripts/macos/doctor.sh --clean 处理
    # 不在容器里做 cron，避免和 bind mount 抢文件

  # 抖音弹幕采集器：纯 Python 直连抖音 wss，替代 Windows 上的 WssBarrageServer.exe。
  # 只在开播时启动：docker compose --profile collector up -d
  # 它把事件 POST 给 dafeiyu 的 Hub(:8888)/inject，dy.py 一行都不用改。
  # 用 profile 隔离是因为没开播时会一直重连刷日志，不该默认常驻。
  douyin-collector:
    image: dafeiyu-ai-vtuber:macos-arm64
    platform: linux/arm64
    container_name: dafeiyu-collector
    profiles: ["collector"]
    restart: unless-stopped
    depends_on:
      - dafeiyu
    environment:
      TZ: Asia/Shanghai
      # 直播间号：复用 .env 的 ROOM_ID（与主程序同一个值），不用再配第二处。
      # 需要分开时才显式设 DY_LIVE_ID。
      DY_LIVE_ID: "${DY_LIVE_ID:-${ROOM_ID:-}}"
      # 走 compose 网络访问主容器的 Hub（Hub 在容器内绑 0.0.0.0，见 BARRAGE_HUB_BIND）
      DAFEIYU_HUB_URL: "http://dafeiyu:8888"
      # 被风控时把自己浏览器里抓到的完整 wss 地址贴进来，{room_id} 会被替换
      # DY_WSS_URL: "wss://webcast5-ws-web-lf.douyin.com/webcast/im/push/v2/?...&room_id={room_id}..."
    volumes:
      - ./integrations:/app/integrations
      - ./protobuf:/app/protobuf
    # 主镜像的 HEALTHCHECK 探的是 8081/5500 这些服务端口，采集器不监听任何端口，
    # 照抄会永远 unhealthy。这里显式关掉，健康与否看日志。
    healthcheck:
      disable: true
    entrypoint: ["python", "/app/integrations/douyin/collector.py"]

volumes: {}
